services:
  postgres:
    image: postgres:16-alpine
    container_name: hanni-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: hanni
      POSTGRES_PASSWORD: hanni
      POSTGRES_DB: hanni
    ports:
      - "127.0.0.1:2222:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - default
      # Mạng chung với pgAdmin (MICROSERVICE_NGINX_SERVICE) để quản lý DB qua pgAdmin.
      - shared_admin

  redis:
    image: redis:7-alpine
    container_name: hanni-redis
    restart: unless-stopped
    ports:
      - "127.0.0.1:2223:6379"
    volumes:
      - redis_data:/data

volumes:
  postgres_data:
  redis_data:

networks:
  default:
  shared_admin:
    name: microservice_nginx_service_default
    external: true