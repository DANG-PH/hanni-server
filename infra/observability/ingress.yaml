apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: observability
spec:
  ingressClassName: traefik
  rules:
    - host: grafana.hanni.localhost
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: grafana
                port:
                  name: http
    - host: prometheus.hanni.localhost
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: prometheus
                port:
                  name: http
    - host: alertmanager.hanni.localhost
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: alertmanager
                port:
                  name: http
    - host: jaeger.hanni.localhost
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: jaeger
                port:
                  name: ui
