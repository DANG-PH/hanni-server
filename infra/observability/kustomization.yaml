apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: observability

resources:
  - namespace.yaml
  - prometheus.yaml
  - alertmanager.yaml
  - blackbox.yaml
  - kube-state-metrics.yaml
  - loki.yaml
  - alloy.yaml
  - jaeger.yaml
  - grafana.yaml
  - ingress.yaml

configMapGenerator:
  - name: prometheus-rules
    files:
      - rules/hanni-slo.yml
  - name: grafana-dashboards
    files:
      - dashboards/slo.json
      - dashboards/scaling.json
      - dashboards/du-lieu.json

generatorOptions:
  disableNameSuffixHash: true
