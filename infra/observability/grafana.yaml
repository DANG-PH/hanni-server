# 3 nguồn dữ liệu nối với nhau: từ dòng log bấm sang vết (traceId), từ vết bấm về log của đúng request đó.
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-provisioning
data:
  datasources.yaml: |
    apiVersion: 1
    datasources:
      - name: Prometheus
        uid: prometheus
        type: prometheus
        url: http://prometheus:9090
        isDefault: true
      - name: Loki
        uid: loki
        type: loki
        url: http://loki:3100
        jsonData:
          derivedFields:
            - name: traceId
              matcherType: regex
              matcherRegex: '"traceId":"(\w+)"'
              url: $${__value.raw}
              datasourceUid: jaeger
      - name: Jaeger
        uid: jaeger
        type: jaeger
        url: http://jaeger:16686
        jsonData:
          tracesToLogsV2:
            datasourceUid: loki
            customQuery: true
            query: '{namespace="hanni"} |= "$${__span.traceId}"'
      - name: Alertmanager
        uid: alertmanager
        type: alertmanager
        url: http://alertmanager:9093
        jsonData:
          implementation: prometheus
  dashboards.yaml: |
    apiVersion: 1
    providers:
      - name: hanni
        type: file
        options:
          path: /var/lib/grafana/dashboards
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: grafana
  labels:
    app: grafana
spec:
  replicas: 1
  selector:
    matchLabels:
      app: grafana
  template:
    metadata:
      labels:
        app: grafana
    spec:
      containers:
        - name: grafana
          image: grafana/grafana:11.6.0
          ports:
            - name: http
              containerPort: 3000
          env:
            - name: GF_SECURITY_ADMIN_USER
              value: admin
            - name: GF_SECURITY_ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: grafana-admin
                  key: password
            - name: GF_ANALYTICS_REPORTING_ENABLED
              value: "false"
            - name: GF_ANALYTICS_CHECK_FOR_UPDATES
              value: "false"
            - name: GF_USERS_DEFAULT_LANGUAGE
              value: en-US
          volumeMounts:
            - name: datasources
              mountPath: /etc/grafana/provisioning/datasources
            - name: dashboard-provider
              mountPath: /etc/grafana/provisioning/dashboards
            - name: dashboards
              mountPath: /var/lib/grafana/dashboards
          resources:
            requests:
              cpu: 25m
              memory: 96Mi
            limits:
              cpu: 500m
              memory: 256Mi
          readinessProbe:
            httpGet:
              path: /api/health
              port: http
      volumes:
        - name: datasources
          configMap:
            name: grafana-provisioning
            items:
              - key: datasources.yaml
                path: datasources.yaml
        - name: dashboard-provider
          configMap:
            name: grafana-provisioning
            items:
              - key: dashboards.yaml
                path: dashboards.yaml
        - name: dashboards
          configMap:
            name: grafana-dashboards
---
apiVersion: v1
kind: Service
metadata:
  name: grafana
spec:
  selector:
    app: grafana
  ports:
    - name: http
      port: 3000
      targetPort: http
