# Bản sao đọc: nhận WAL từ leader qua streaming, bất đồng bộ (DDIA ch. 5).
# Bất đồng bộ nghĩa là leader không chờ bản sao: ghi nhanh, nhưng leader chết thì mất phần WAL chưa kịp chuyển.
# Slot hanni_replica giữ WAL cho bản sao tụt lại, có trần max_slot_wal_keep_size để bản sao chết không làm đầy đĩa leader.
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: hanni-postgres-replica
  labels:
    app: hanni-postgres-replica
spec:
  serviceName: hanni-postgres-replica
  replicas: 1
  selector:
    matchLabels:
      app: hanni-postgres-replica
  template:
    metadata:
      labels:
        app: hanni-postgres-replica
        tier: data
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "9187"
    spec:
      terminationGracePeriodSeconds: 30
      # Đặt khác node với leader: mất 1 node vẫn còn 1 bản dữ liệu.
      affinity:
        podAntiAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            - labelSelector:
                matchLabels:
                  tier: data
                matchExpressions:
                  - key: app
                    operator: In
                    values: [hanni-postgres]
              topologyKey: kubernetes.io/hostname
      initContainers:
        - name: clone
          image: postgres:16-alpine
          command:
            - sh
            - -c
            - |
              set -e
              [ -s "$PGDATA/PG_VERSION" ] && exit 0
              until pg_isready -h hanni-postgres; do sleep 2; done
              pg_basebackup -h hanni-postgres -U replicator -D "$PGDATA" -S hanni_replica -R -X stream
          env:
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
            - name: PGPASSWORD
              valueFrom:
                secretKeyRef:
                  name: hanni-secrets
                  key: REPLICATION_PASSWORD
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
      containers:
        - name: postgres
          image: postgres:16-alpine
          args:
            - -c
            - max_connections=60
            - -c
            - shared_buffers=64MB
            - -c
            - hot_standby_feedback=on
          ports:
            - name: postgres
              containerPort: 5432
          env:
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
            - name: POSTGRES_USER
              value: hanni
            - name: POSTGRES_DB
              value: hanni
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: hanni-secrets
                  key: POSTGRES_PASSWORD
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: "1"
              memory: 384Mi
          readinessProbe:
            exec:
              command: [pg_isready, -U, hanni, -d, hanni]
            periodSeconds: 5
        - name: exporter
          image: quay.io/prometheuscommunity/postgres-exporter:v0.17.1
          ports:
            - name: metrics
              containerPort: 9187
          env:
            - name: DATA_SOURCE_URI
              value: 127.0.0.1:5432/hanni?sslmode=disable
            - name: DATA_SOURCE_USER
              value: hanni
            - name: DATA_SOURCE_PASS
              valueFrom:
                secretKeyRef:
                  name: hanni-secrets
                  key: POSTGRES_PASSWORD
          resources:
            requests:
              cpu: 10m
              memory: 24Mi
            limits:
              cpu: 100m
              memory: 64Mi
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: [ReadWriteOnce]
        resources:
          requests:
            storage: 2Gi
---
apiVersion: v1
kind: Service
metadata:
  name: hanni-postgres-replica
  labels:
    app: hanni-postgres-replica
spec:
  clusterIP: None
  selector:
    app: hanni-postgres-replica
  ports:
    - name: postgres
      port: 5432
      targetPort: postgres
---
# PgBouncer riêng cho đường đọc, cùng cách gom kết nối như đường ghi.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: hanni-pgbouncer-ro
  labels:
    app: hanni-pgbouncer-ro
spec:
  replicas: 1
  selector:
    matchLabels:
      app: hanni-pgbouncer-ro
  template:
    metadata:
      labels:
        app: hanni-pgbouncer-ro
        tier: data
    spec:
      containers:
        - name: pgbouncer
          image: edoburu/pgbouncer:v1.24.1-p1
          ports:
            - name: postgres
              containerPort: 5432
          env:
            - name: DB_HOST
              value: hanni-postgres-replica
            - name: DB_NAME
              value: hanni
            - name: DB_USER
              value: hanni
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: hanni-secrets
                  key: POSTGRES_PASSWORD
            - name: AUTH_TYPE
              value: scram-sha-256
            - name: POOL_MODE
              value: transaction
            - name: MAX_CLIENT_CONN
              value: "500"
            - name: DEFAULT_POOL_SIZE
              value: "20"
            - name: IGNORE_STARTUP_PARAMETERS
              value: extra_float_digits,options
          resources:
            requests:
              cpu: 25m
              memory: 16Mi
            limits:
              cpu: 300m
              memory: 64Mi
          readinessProbe:
            tcpSocket:
              port: postgres
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: hanni-pgbouncer-ro
  labels:
    app: hanni-pgbouncer-ro
spec:
  selector:
    app: hanni-pgbouncer-ro
  ports:
    - name: postgres
      port: 5432
      targetPort: postgres
