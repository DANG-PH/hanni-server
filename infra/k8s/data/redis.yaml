# Redis chỉ giữ dữ liệu dựng lại được (hạn mức, lượt chơi, cache), nên không bật lưu đĩa và không sao lưu.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: hanni-redis
  labels:
    app: hanni-redis
spec:
  replicas: 1
  selector:
    matchLabels:
      app: hanni-redis
  template:
    metadata:
      labels:
        app: hanni-redis
        tier: data
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "9121"
    spec:
      containers:
        - name: redis
          image: redis:7-alpine
          args: [--save, "", --appendonly, "no", --maxmemory, 96mb, --maxmemory-policy, volatile-lru]
          ports:
            - name: redis
              containerPort: 6379
          resources:
            requests:
              cpu: 50m
              memory: 32Mi
            limits:
              cpu: 500m
              memory: 128Mi
          readinessProbe:
            exec:
              command: [redis-cli, ping]
            periodSeconds: 5
        - name: exporter
          image: oliver006/redis_exporter:v1.69.0-alpine
          ports:
            - name: metrics
              containerPort: 9121
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              cpu: 100m
              memory: 32Mi
---
apiVersion: v1
kind: Service
metadata:
  name: hanni-redis
  labels:
    app: hanni-redis
spec:
  selector:
    app: hanni-redis
  ports:
    - name: redis
      port: 6379
      targetPort: redis
