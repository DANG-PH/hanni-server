apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: hanni-backup
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests:
      storage: 2Gi
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: hanni-backup
spec:
  # 19:00 UTC là 02:00 giờ Việt Nam. Giờ chạy trên chính cụm nên chính xác, không trễ như lịch của GitHub Actions.
  schedule: "0 19 * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 1
      template:
        metadata:
          labels:
            app: hanni-backup
        spec:
          restartPolicy: Never
          containers:
            - name: backup
              image: postgres:16-alpine
              command: [sh, /scripts/backup.sh]
              env:
                - name: PGHOST
                  value: hanni-postgres
                - name: PGUSER
                  value: hanni
                - name: PGDATABASE
                  value: hanni
                - name: PGPASSWORD
                  valueFrom:
                    secretKeyRef:
                      name: hanni-secrets
                      key: POSTGRES_PASSWORD
                - name: BACKUP_KEEP
                  value: "14"
              volumeMounts:
                - name: scripts
                  mountPath: /scripts
                  readOnly: true
                - name: backup
                  mountPath: /backup
                - name: hoc-lieu
                  mountPath: /srv/hoc-lieu
                  readOnly: true
              resources:
                requests:
                  cpu: 50m
                  memory: 64Mi
                limits:
                  cpu: "1"
                  memory: 256Mi
          volumes:
            - name: scripts
              configMap:
                name: hanni-backup-script
            - name: backup
              persistentVolumeClaim:
                claimName: hanni-backup
            - name: hoc-lieu
              hostPath:
                path: /srv/hoc-lieu
                type: Directory
