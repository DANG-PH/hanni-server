# Mặc định chặn hết chiều vào, chỉ mở đúng đường đi của kiến trúc: ingress → API/media, API → PgBouncer/Redis,
# PgBouncer → Postgres. Prometheus vào được cổng số đo. API lỡ bị chiếm cũng không chạm thẳng được Postgres.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny-ingress
spec:
  podSelector: {}
  policyTypes: [Ingress]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-ingress-to-web
spec:
  podSelector:
    matchExpressions:
      - key: app
        operator: In
        values: [hanni-api, hanni-media]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-prometheus
spec:
  podSelector: {}
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: observability
          podSelector:
            matchLabels:
              app: prometheus
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-backend-to-cache
spec:
  podSelector:
    matchExpressions:
      - key: app
        operator: In
        values: [hanni-pgbouncer, hanni-pgbouncer-ro, hanni-redis]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              tier: backend
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-postgres
spec:
  podSelector:
    matchLabels:
      app: hanni-postgres
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app: hanni-pgbouncer
        - podSelector:
            matchLabels:
              app: hanni-tools
        - podSelector:
            matchLabels:
              app: hanni-backup
        - podSelector:
            matchLabels:
              app: hanni-postgres-replica
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-postgres-replica
spec:
  podSelector:
    matchLabels:
      app: hanni-postgres-replica
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app: hanni-pgbouncer-ro
        # Lúc diễn tập failover, PgBouncer ghi trỏ sang đây.
        - podSelector:
            matchLabels:
              app: hanni-pgbouncer
